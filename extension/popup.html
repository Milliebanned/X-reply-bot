<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 400px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #333; }
    .container { padding: 16px; }
    .header { margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    #version { font-size: 11px; font-weight: 400; color: #999; }
    .status { font-size: 12px; color: #999; }
    .status.active { color: #1da1f2; }
    .section { margin-bottom: 16px; }
    .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #666; margin-bottom: 8px; }
    .input-group { margin-bottom: 12px; }
    .settings-row { display: flex; gap: 8px; }
    .settings-row .input-group { flex: 1; }
    .settings-row .input-group.narrow { flex: 0 0 96px; }
    .saved-hint { font-size: 11px; color: #999; margin: -4px 0 12px; }
    .saved-hint.flash { color: #1da1f2; }
    label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: #555; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; font-size: 12px; }
    textarea { resize: vertical; min-height: 80px; }
    button { width: 100%; padding: 10px; background: #1da1f2; color: white; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1a91da; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .suggestions { max-height: 300px; overflow-y: auto; margin-top: 12px; }
    .suggestion-item { background: #f5f5f5; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    .suggestion-text { font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
    .suggestion-actions { display: flex; gap: 8px; }
    .suggestion-btn { flex: 1; padding: 6px; font-size: 11px; border: 1px solid #ddd; border-radius: 4px; background: white; color: #333; cursor: pointer; }
    .suggestion-btn.use { background: #1da1f2; color: white; border-color: #1da1f2; }
    .loading { text-align: center; color: #999; font-size: 12px; padding: 20px; }
    .error { background: #fff5f5; color: #c41e3a; padding: 10px; border-radius: 4px; font-size: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>X Reply Copilot <span id="version"></span></h1>
      <div class="status" id="status">Initializing...</div>
    </div>

    <div class="section">
      <div class="section-title">Post Context</div>
      <textarea id="postText" placeholder="Paste the post text here..."></textarea>
    </div>

    <div class="section">
      <div class="section-title">Generate Suggestions</div>
      <div class="settings-row">
        <div class="input-group">
          <label for="tone">Reply Tone (optional)</label>
          <input type="text" id="tone" placeholder="e.g., witty, helpful, critical">
        </div>
        <div class="input-group narrow">
          <label for="maxWords">Max words</label>
          <input type="number" id="maxWords" min="5" max="60" step="1">
        </div>
      </div>
      <div class="saved-hint" id="savedHint">Tone and length are saved automatically</div>
      <button id="generateBtn">Generate Reply Options</button>
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div id="suggestions" class="suggestions"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
